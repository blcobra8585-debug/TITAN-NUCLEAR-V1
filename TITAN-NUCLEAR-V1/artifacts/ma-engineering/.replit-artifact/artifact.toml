kind = "mobile"
previewPath = "/ma-engineering/"
title = "MA Engineering"
version = "1.0.0"
id = "artifacts/ma-engineering"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/ma-engineering/" ]
localPort = 19096

[services.development]
run = "pnpm --filter @workspace/ma-engineering run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ma-engineering", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ma-engineering", "run", "serve" ]

[services.env]
PORT = "19096"
BASE_PATH = "/ma-engineering/"
