name: Build MA TITAN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify pnpm hoisted install layout
        run: |
          echo "=== .npmrc contents ==="
          cat .npmrc
          echo "=== node_modules layout (top-level, first 30) ==="
          ls node_modules/ | head -30
          echo "=== react-native-worklets location check ==="
          ls node_modules/react-native-worklets/package.json 2>/dev/null && echo "✅ Found at workspace root node_modules" || echo "❌ NOT at workspace root node_modules"
          echo "=== react-native-reanimated check ==="
          ls node_modules/react-native-reanimated/package.json 2>/dev/null && echo "✅ Found" || echo "❌ NOT found"

      - name: Expo Prebuild (Android)
        working-directory: artifacts/ma-engineering
        run: pnpm exec expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_DOTENV: 1
          CI: 1
          EXPO_NO_DEPENDENCY_UPDATE: 1

      - name: Patch android files for pnpm monorepo + New Architecture
        run: |
          GRADLE_PROPS="artifacts/ma-engineering/android/gradle.properties"

          # 1. Enable New Architecture (required by reanimated 4.x + worklets)
          if grep -q "newArchEnabled" "$GRADLE_PROPS"; then
            sed -i 's/newArchEnabled=false/newArchEnabled=true/' "$GRADLE_PROPS"
          else
            echo "newArchEnabled=true" >> "$GRADLE_PROPS"
          fi

          # 2. Force JS bundle to be included in RELEASE builds.
          #    This is the key flag — without it, assembleRelease may skip
          #    bundling if it thinks we're in a dev environment.
          if grep -q "bundleInRelease" "$GRADLE_PROPS"; then
            sed -i 's/bundleInRelease=.*/bundleInRelease=true/' "$GRADLE_PROPS"
          else
            echo "bundleInRelease=true" >> "$GRADLE_PROPS"
          fi

          echo "gradle.properties after patch:"
          grep -E "newArchEnabled|bundleInRelease" "$GRADLE_PROPS"

          # 3. Inject REACT_NATIVE_WORKLETS_NODE_MODULES_DIR into app/build.gradle
          WORKLETS_ABS=""
          if [ -f "$(pwd)/node_modules/react-native-worklets/package.json" ]; then
            WORKLETS_ABS="$(pwd)/node_modules/react-native-worklets"
            echo "Found react-native-worklets at workspace root: $WORKLETS_ABS"
          elif [ -f "$(pwd)/artifacts/ma-engineering/node_modules/react-native-worklets/package.json" ]; then
            WORKLETS_ABS="$(pwd)/artifacts/ma-engineering/node_modules/react-native-worklets"
            echo "Found react-native-worklets at artifact level: $WORKLETS_ABS"
          else
            WORKLETS_PKG=$(find $(pwd)/node_modules -name "package.json" -path "*/react-native-worklets/package.json" ! -path "*worklets-core*" -maxdepth 6 2>/dev/null | head -1)
            if [ -n "$WORKLETS_PKG" ]; then
              WORKLETS_ABS=$(dirname "$WORKLETS_PKG")
              echo "Found react-native-worklets via search: $WORKLETS_ABS"
            fi
          fi

          if [ -z "$WORKLETS_ABS" ]; then
            echo "::error::Could not locate react-native-worklets — aborting."
            ls $(pwd)/node_modules/ | grep -i worklets || echo "(none found)"
            exit 1
          fi

          APP_GRADLE="artifacts/ma-engineering/android/app/build.gradle"
          sed -i "1s|^|ext {\n    REACT_NATIVE_WORKLETS_NODE_MODULES_DIR = \"$WORKLETS_ABS\"\n}\n|" "$APP_GRADLE"
          echo "Injected REACT_NATIVE_WORKLETS_NODE_MODULES_DIR:"
          head -5 "$APP_GRADLE"

          # 4. Ensure release buildType uses debug signing config for CI testing.
          #    Expo's generated build.gradle already does this by default, but
          #    patch it explicitly in case prebuild generated a different template.
          if ! grep -q "signingConfig signingConfigs.debug" "$APP_GRADLE"; then
            sed -i '/buildTypes {/,/}/ s/release {/release {\n            signingConfig signingConfigs.debug/' "$APP_GRADLE"
            echo "Patched release signingConfig to use debug keystore"
          else
            echo "release signingConfig already uses debug keystore ✅"
          fi

          # 5. Patch expo-router _ctx files: replace process.env.EXPO_ROUTER_APP_ROOT
          #    with literal 'app'. @expo/metro-config's transform-worker evaluates
          #    require.context() args statically at Babel transform time, so a runtime
          #    env var never resolves → SyntaxError "Invalid call".
          for CTX_FILE in \
            "$(pwd)/node_modules/expo-router/_ctx.android.js" \
            "$(pwd)/artifacts/ma-engineering/node_modules/expo-router/_ctx.android.js"; do
            if [ -f "$CTX_FILE" ]; then
              sed -i "s|process\.env\.EXPO_ROUTER_APP_ROOT|'app'|g" "$CTX_FILE"
              echo "✅ Patched $CTX_FILE"
              head -5 "$CTX_FILE"
            fi
          done

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake 3.31 + NDK 27
        run: |
          sdkmanager "cmake;3.31.3" "ndk;27.2.12479018" 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure Android debug keystore exists
        run: |
          # Release builds need to be signed — use the standard debug keystore.
          # This is safe for internal/testing APKs. For production you'd use
          # a real keystore stored as a GitHub Secret.
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug, O=Android, C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -v 2>/dev/null
            echo "✅ Debug keystore generated"
          else
            echo "✅ Debug keystore already exists"
          fi

      - name: Make gradlew executable
        working-directory: artifacts/ma-engineering/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: artifacts/ma-engineering/android
        # assembleRelease — CRITICAL: bundles JS into the APK so it works
        # without a Metro dev server. assembleDebug does NOT bundle JS and
        # tries to load from a network server → native splash hangs forever.
        run: ./gradlew assembleRelease --no-daemon -x lint --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          CMAKE_PATH: /usr/local/lib/android/sdk/cmake/3.31.3/bin

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find artifacts/ma-engineering/android -name '*.apk' | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Rename APK
        run: |
          cp "${{ steps.find_apk.outputs.apk_path }}" MA-TITAN-v${{ github.run_number }}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MA-TITAN-APK-v${{ github.run_number }}
          path: MA-TITAN-v${{ github.run_number }}.apk
          retention-days: 30

      - name: Delete old releases (keep latest only)
        run: |
          gh release list --limit 5 --json tagName -q '.[].tagName' | tail -n +2 | xargs -I{} gh release delete {} --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "MA TITAN v3.2 — Build #${{ github.run_number }}"
          body: |
            ## ✅ MA TITAN v3.2 — Build #${{ github.run_number }}

            ### 📥 Install karne ka tarika:
            1. Neeche `MA-TITAN-v${{ github.run_number }}.apk` download karo
            2. Phone mein **Settings → Security → Unknown Sources ON** karo
            3. **Purani app UNINSTALL karo** (overwrite mat karo)
            4. APK file open karo → Install

            ### 🚀 Features:
            - **TITAN AI** — Multi-model AI (Gemini/GPT/Claude/Groq)
            - **Deal Pipeline** — Kanban board with 5 stages
            - **Lead Bot** — IndiaMART auto-fetch → Firebase
            - **Lily Voice** — ElevenLabs TTS
            - **Recruit Bot** — Auto job posting
            - **PIN Security** — App lock
            - **Auto Update** — GitHub release checker

            **Build SHA:** `${{ github.sha }}`
          files: MA-TITAN-v${{ github.run_number }}.apk
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
