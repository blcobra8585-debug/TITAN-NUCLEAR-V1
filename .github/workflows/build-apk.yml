name: Build MA TITAN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify pnpm hoisted install layout
        run: |
          echo "=== .npmrc contents ==="
          cat .npmrc
          echo "=== node_modules layout (top-level, first 30) ==="
          ls node_modules/ | head -30
          echo "=== react-native-worklets location check ==="
          ls node_modules/react-native-worklets/package.json 2>/dev/null && echo "✅ Found at workspace root node_modules" || echo "❌ NOT at workspace root node_modules"
          echo "=== react-native-reanimated check ==="
          ls node_modules/react-native-reanimated/package.json 2>/dev/null && echo "✅ Found" || echo "❌ NOT found"

      - name: Expo Prebuild (Android)
        working-directory: artifacts/ma-engineering
        run: pnpm exec expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_DOTENV: 1
          CI: 1
          EXPO_NO_DEPENDENCY_UPDATE: 1

      - name: Patch android files for pnpm monorepo + New Architecture
        run: |
          # 1. Enable New Architecture in gradle.properties (required by reanimated 4.x + worklets)
          GRADLE_PROPS="artifacts/ma-engineering/android/gradle.properties"
          if grep -q "newArchEnabled" "$GRADLE_PROPS"; then
            sed -i 's/newArchEnabled=false/newArchEnabled=true/' "$GRADLE_PROPS"
          else
            echo "newArchEnabled=true" >> "$GRADLE_PROPS"
          fi
          echo "gradle.properties after patch:"
          grep "newArchEnabled" "$GRADLE_PROPS"

          # 2. Inject REACT_NATIVE_WORKLETS_NODE_MODULES_DIR into app/build.gradle
          # With node-linker=hoisted, pnpm installs packages flat — check both
          # the workspace root and the artifact's own node_modules.
          WORKLETS_ABS=""

          # Check workspace root node_modules first (hoisted location)
          if [ -f "$(pwd)/node_modules/react-native-worklets/package.json" ]; then
            WORKLETS_ABS="$(pwd)/node_modules/react-native-worklets"
            echo "Found react-native-worklets at workspace root: $WORKLETS_ABS"
          # Check artifact-level node_modules as fallback
          elif [ -f "$(pwd)/artifacts/ma-engineering/node_modules/react-native-worklets/package.json" ]; then
            WORKLETS_ABS="$(pwd)/artifacts/ma-engineering/node_modules/react-native-worklets"
            echo "Found react-native-worklets at artifact level: $WORKLETS_ABS"
          else
            # Last resort: search anywhere under node_modules (handles edge cases)
            WORKLETS_PKG=$(find $(pwd)/node_modules -name "package.json" -path "*/react-native-worklets/package.json" ! -path "*worklets-core*" -maxdepth 6 2>/dev/null | head -1)
            if [ -n "$WORKLETS_PKG" ]; then
              WORKLETS_ABS=$(dirname "$WORKLETS_PKG")
              echo "Found react-native-worklets via search: $WORKLETS_ABS"
            fi
          fi

          if [ -z "$WORKLETS_ABS" ]; then
            echo "::error::Could not locate react-native-worklets — aborting. Check that node-linker=hoisted is in .npmrc and pnpm install succeeded."
            echo "node_modules listing for debug:"
            ls $(pwd)/node_modules/ | grep -i worklets || echo "(none found)"
            exit 1
          fi

          APP_GRADLE="artifacts/ma-engineering/android/app/build.gradle"
          sed -i "1s|^|ext {\n    REACT_NATIVE_WORKLETS_NODE_MODULES_DIR = \"$WORKLETS_ABS\"\n}\n|" "$APP_GRADLE"
          echo "Injected REACT_NATIVE_WORKLETS_NODE_MODULES_DIR:"
          head -5 "$APP_GRADLE"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake 3.31 + NDK 27
        run: |
          sdkmanager "cmake;3.31.3" "ndk;27.2.12479018" 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        working-directory: artifacts/ma-engineering/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: artifacts/ma-engineering/android
        run: ./gradlew assembleDebug --no-daemon -x lint --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          CMAKE_PATH: /usr/local/lib/android/sdk/cmake/3.31.3/bin

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find artifacts/ma-engineering/android -name '*.apk' | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Rename APK
        run: |
          cp "${{ steps.find_apk.outputs.apk_path }}" MA-TITAN-v${{ github.run_number }}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MA-TITAN-APK-v${{ github.run_number }}
          path: MA-TITAN-v${{ github.run_number }}.apk
          retention-days: 30

      - name: Delete old releases (keep latest only)
        run: |
          gh release list --limit 5 --json tagName -q '.[].tagName' | tail -n +2 | xargs -I{} gh release delete {} --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "MA TITAN v3.2 — Build #${{ github.run_number }}"
          body: |
            ## ✅ MA TITAN v3.2 — Build #${{ github.run_number }}

            ### 📥 Install karne ka tarika:
            1. Neeche `MA-TITAN-v${{ github.run_number }}.apk` download karo
            2. Phone mein **Settings → Security → Unknown Sources ON** karo
            3. APK file open karo → Install
            4. Purani app pehle uninstall karo phir install karo

            ### 🚀 Features:
            - **TITAN AI** — Multi-model AI (Gemini/GPT/Claude/Groq)
            - **Deal Pipeline** — Kanban board with 5 stages
            - **Lead Bot** — IndiaMART auto-fetch → Firebase
            - **Lily Voice** — ElevenLabs TTS
            - **Recruit Bot** — Auto job posting
            - **PIN Security** — App lock
            - **Auto Update** — GitHub release checker

            **Build SHA:** `${{ github.sha }}`
          files: MA-TITAN-v${{ github.run_number }}.apk
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
