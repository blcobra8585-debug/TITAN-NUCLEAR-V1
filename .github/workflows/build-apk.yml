name: Build MA TITAN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo Prebuild (Android)
        working-directory: artifacts/ma-engineering
        run: pnpm exec expo prebuild --platform android --clean
        env:
          EXPO_NO_DOTENV: 1
          CI: 1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake 3.31 + NDK 27
        run: |
          sdkmanager "cmake;3.31.3" "ndk;27.2.12479018" 2>/dev/null || true
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        working-directory: artifacts/ma-engineering/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: artifacts/ma-engineering/android
        run: ./gradlew assembleDebug --no-daemon -x lint --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          CMAKE_PATH: /usr/local/lib/android/sdk/cmake/3.31.3/bin

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find artifacts/ma-engineering/android -name '*.apk' | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Rename APK
        run: |
          cp "${{ steps.find_apk.outputs.apk_path }}" MA-TITAN-v${{ github.run_number }}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MA-TITAN-APK-v${{ github.run_number }}
          path: MA-TITAN-v${{ github.run_number }}.apk
          retention-days: 30

      - name: Delete old releases (keep latest only)
        run: |
          gh release list --limit 5 --json tagName -q '.[].tagName' | tail -n +2 | xargs -I{} gh release delete {} --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "MA TITAN v3.2 — Build #${{ github.run_number }}"
          body: |
            ## ✅ MA TITAN v3.2 — Build #${{ github.run_number }}

            ### 📥 Install karne ka tarika:
            1. Neeche `MA-TITAN-v${{ github.run_number }}.apk` download karo
            2. Phone mein **Settings → Security → Unknown Sources ON** karo
            3. APK file open karo → Install
            4. Purani app pehle uninstall karo phir install karo

            ### 🔧 Is build mein kya hai:
            - ✅ **CRASH FIX** — react-native-reanimated 3.19.5 → 4.x (Expo SDK 54 compatible)
            - ✅ react-native-worklets-core added (reanimated 4.x peer dep)
            - ✅ expo prebuild --clean se fresh native Android code generated
            - ✅ Firebase guards — firebaseReady check in all Firestore calls
            - ✅ **Deal Pipeline Kanban** — Lead → Quoted → Negotiation → Won/Lost
            - ✅ **Ghost Lead Detector** 👻 — 48h+ unreplied leads flagged
            - ✅ **Deal Temperature** — 🔥 Hot / ⚡ Warm / ❄️ Cold badges
            - ✅ **Trust Badge** auto-attached on first Lily reply
            - ✅ WA token moved server-side (no more localStorage)

            ### 🚀 Features:
            - **TITAN AI** — Multi-model AI (Gemini/GPT/Claude/Groq)
            - **Deal Pipeline** — Kanban board with 5 stages
            - **Lead Bot** — IndiaMART auto-fetch → Firebase
            - **Lily Voice** — ElevenLabs TTS
            - **Recruit Bot** — Auto job posting
            - **PIN Security** — App lock
            - **Auto Update** — GitHub release checker

            **Build SHA:** `${{ github.sha }}`
          files: MA-TITAN-v${{ github.run_number }}.apk
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
