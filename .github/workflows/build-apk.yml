name: Build MA TITAN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo Prebuild (Android)
        working-directory: artifacts/ma-engineering
        run: pnpm exec expo prebuild --platform android --no-install
        env:
          EXPO_NO_DOTENV: 1
          CI: 1

      - name: Make gradlew executable
        working-directory: artifacts/ma-engineering/android
        run: chmod +x gradlew

      - name: Build Release APK
        working-directory: artifacts/ma-engineering/android
        run: ./gradlew assembleRelease --no-daemon -x lint
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Find APK
        run: find artifacts/ma-engineering/android -name '*.apk' | head -10

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MA-TITAN-APK
          path: artifacts/ma-engineering/android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "MA TITAN v${{ github.run_number }} — Made by Hell 52"
          body: |
            ## MA TITAN Engineering App
            **Made by Hell 52**

            ### Install karne ka tarika:
            1. APK download karo niche se
            2. Phone mein Settings → Security → Unknown Sources ON karo
            3. APK file open karo aur install karo

            ### Features:
            - Dashboard + Titan Mode
            - Lily AI Chat (Gemini)
            - Auto Quote Generator + WhatsApp
            - Client CRM + History
            - Admin Panel

            > Pure Firebase backend — koi server needed nahi!
          files: artifacts/ma-engineering/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
