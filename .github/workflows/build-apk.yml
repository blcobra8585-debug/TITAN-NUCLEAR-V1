name: Build MA TITAN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo Prebuild (Android)
        working-directory: artifacts/ma-engineering
        run: pnpm exec expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_DOTENV: 1
          CI: 1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        working-directory: artifacts/ma-engineering/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: artifacts/ma-engineering/android
        run: ./gradlew assembleDebug --no-daemon -x lint --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

      - name: Find APK
        run: find artifacts/ma-engineering/android -name '*.apk' | head -10

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MA-TITAN-DEBUG-APK
          path: artifacts/ma-engineering/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "MA TITAN v${{ github.run_number }} — Made by Hell 52"
          body: |
            ## MA TITAN Engineering App
            **Made by Hell 52**

            ### Install karne ka tarika:
            1. APK download karo niche se (MA-TITAN-vX.apk)
            2. Phone mein **Settings → Security → Unknown Sources ON** karo
            3. APK file open karo aur install karo

            ### Features:
            - Dashboard + Titan Mode (Suhan Siddiqui)
            - Lily AI Chat (Gemini powered)
            - Auto Quote Generator + WhatsApp send
            - Client CRM + Quote History
            - Admin Panel (API keys config)

            > Pure Firebase backend — Replit server ki zaroorat nahi!
          files: artifacts/ma-engineering/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
